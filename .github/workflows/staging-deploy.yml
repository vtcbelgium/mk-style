name: MK Style - staging deploy (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mk-style-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    # Never run this workflow against main or a pull request/fork.
    if: github.repository == 'vtcbelgium/mk-style' && github.ref == 'refs/heads/feat/production-readiness-2026-11'
    runs-on: ubuntu-latest
    environment: mk-style-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Test business rules and preview security
        run: npm test
      - name: Build site
        run: npm run build
      - name: Verify Pages Functions compile
        run: npx wrangler pages functions build functions --project-directory . --outfile .wrangler/ci/_worker.bundle.mjs
      - name: Require scoped deployment secrets
        env:
          TOKEN: ${{ secrets.MK_STYLE_CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.MK_STYLE_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Configure MK_STYLE_CLOUDFLARE_API_TOKEN and MK_STYLE_CLOUDFLARE_ACCOUNT_ID in the mk-style-staging GitHub environment."
            exit 1
          fi
      - name: Deploy preview branch only (never production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MK_STYLE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MK_STYLE_CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler pages deploy dist
          --project-name mk-style
          --branch feat/production-readiness-2026-11
          --commit-hash "${{ github.sha }}"
          --commit-message "CI validated staging build"
